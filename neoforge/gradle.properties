# Память для Gradle
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Parchment (понятные имена параметров), актуальные версии: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.11
parchment_mappings_version=2025.12.20

# Версии игры/загрузчика. Актуальные NeoForge: https://projects.neoforged.net/neoforged/neoforge
minecraft_version=1.21.11
minecraft_version_range=[1.21.11]
neo_version=21.11.48

# Свойства мода
mod_id=wildegate
mod_name=WildeGate KeyBinds
mod_license=MIT
mod_version=1.1
mod_group_id=ru.wildegate
